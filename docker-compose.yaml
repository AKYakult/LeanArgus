services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: "argus-pg"
    environment:
      POSTGRES_USER: "jin"
      POSTGRES_PASSWORD: "021799"
      POSTGRES_DB: "argus"
    ports:
      - "12138:5432"
    volumes:
      - argus-pg-data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: "argus-minio"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - argus-minio-data:/data

volumes:
  argus-pg-data:
  argus-minio-data: